# 凭据模板 —— 复制成 ~/.dsh/.credentials.yaml 再填自己的值。
#
# ⚠ 真实文件里是明文密钥。别提交它，别贴进聊天，别放进任何仓库。
#    本仓库的 .gitignore 已排除 .credentials.yaml。
#
# 说明：
#   refs    命名引用，`DEEPSEEK_API_KEY` 就是 DSH 用来调模型的 key。
#   records 连接级凭据。client-connection/browser-session 那个 secret 是
#           浏览器会话的授权票据，本地 Web GUI 登录用；DSH 首次启动会自己生成，
#           这里留空即可，除非你要复用已有的。
#
# 怎么拿到 DeepSeek key：https://platform.deepseek.com/api_keys

version: 1
refs:
  DEEPSEEK_API_KEY: 'your-deepseek-api-key-here'

# 可留空——DSH 会自己生成一个新的 browser-session 票据。
records: {}

# Machine-level dsh patch layer — applied to EVERY profile (web, headless, sdk,
# acp), after each profile's own cordis.patch.yml.
#
# Comment out (or set `disabled: true` on) any row to turn it back off.
#
# 放在 ~/.dsh/cordis.patch.yml。
# 下面几处占位符要按你的机器改：
#   ~                        → 你的 home（Windows 上 C:/Users/<你的用户名>）
#   <ling-muxue-daemon>      → memory_mcp_server.py 所在目录
# 原文里这些是写死的绝对路径，搬到别的机器上会静默失效（MCP 起不来不报错）。

# ── skills ──────────────────────────────────────────────────────────────────
# dsh scans .dsh/skills, .agents/skills and <dshHome>/skills by default; the
# Claude Code user root is not one of them, so add it as a custom root.
# Directory bundles <name>/SKILL.md and flat <name>.md both load; frontmatter
# needs kebab-case `name` + `description`. Extra Claude Code keys (model,
# version, triggers, ...) are ignored.
- id: skill-filesystem
  config:
    customSkillDirs:
      - ~/.claude/skills

- insert:
    # ── MCP servers (mirrors ~/.mcp.json) ───────────────────────────────────
    # Tools land on the model as mcp__<serverName>__<tool>.
    #
    # claude-flow 关掉了（2026-09-12）。它本来是 Claude Code 那套（~/.mcp.json）
    # 镜像过来的，跟 DSH 自身的工具集无关；代价是每开一个会话都跑一次
    # `cmd /c npx -y ruflo@latest mcp start`——闪一个黑窗，而且进程会留着占内存。
    # 实测：一晚上攒了两套常驻（16:52 一套、20:55 一套）。
    # 要恢复：把这行改成 `disabled: false`（或删掉）。
    - id: mcp-claude-flow
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: claude-flow
        transport: stdio
        command: cmd
        args: ['/c', 'npx', '-y', 'ruflo@latest', 'mcp', 'start']
        env:
          npm_config_update_notifier: 'false'
          CLAUDE_FLOW_MODE: v3
          CLAUDE_FLOW_HOOKS_ENABLED: 'true'
          CLAUDE_FLOW_TOPOLOGY: hierarchical-mesh
          CLAUDE_FLOW_MAX_AGENTS: '15'
          CLAUDE_FLOW_MEMORY_BACKEND: hybrid

    # 凌暮雪的共享记忆库（微信端和终端共用同一个 memory.db）。
    # 这个 MCP server 不在本仓库里，是另一个目录下的 memory_mcp_server.py。
    - id: mcp-ling-muxue-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ling-muxue-memory
        transport: stdio
        command: python
        args: ['<ling-muxue-daemon>/memory_mcp_server.py']
        env:
          CHARACTER_CHAT_URL: http://127.0.0.1:8000
          PYTHONIOENCODING: utf-8

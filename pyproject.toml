[project]
name = "character-chat"
version = "0.1.0"
description = "Terminal-based AI character chat with long-term memory and emotion"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "requests>=2.31",
    "typeguard>=4.0",
    "ruamel.yaml>=0.18",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "loguru>=0.7",
    "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/character_chat"]

[tool.hatch.build.targets.wheel.sources]
"src/character_chat" = "character_chat"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
